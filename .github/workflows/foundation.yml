name: Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Foundation tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:docs
      - name: Installer syntax and unsupported-host rejection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n installer/install.sh
          bash -n installer/install-ai.sh
          bash -n installer/activate-ai.sh
          bash -n installer/qualify-ai.sh
          if bash installer/install.sh --check; then
            echo "Unexpectedly accepted Ubuntu as Debian 13"
            exit 1
          fi
      - name: Verify missing production evidence blocks release
        shell: bash
        run: |
          if npm run release:check; then
            echo "Release check accepted missing evidence"
            exit 1
          fi
      - run: git diff --check
